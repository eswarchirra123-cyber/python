<svg xmlns="http://www.w3.org/2000/svg" width="920" height="576" viewBox="0 0 920 576"><rect width="100%" height="100%" fill="white"/><text x="460" y="36" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#172554">Simple Calculator</text><rect x="170" y="58" width="580" height="52" rx="26" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="460" y="90" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Start</text><path d="M460 110 V140 M452 132 L460 140 L468 132" stroke="#334155" stroke-width="2" fill="none"/><rect x="170" y="144" width="580" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="460" y="176" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Read two numbers and operator</text><path d="M460 196 V226 M452 218 L460 226 L468 218" stroke="#334155" stroke-width="2" fill="none"/><rect x="170" y="230" width="580" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="460" y="262" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Check selected operator</text><path d="M460 282 V312 M452 304 L460 312 L468 304" stroke="#334155" stroke-width="2" fill="none"/><rect x="170" y="316" width="580" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="460" y="348" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Perform calculation</text><path d="M460 368 V398 M452 390 L460 398 L468 390" stroke="#334155" stroke-width="2" fill="none"/><rect x="170" y="402" width="580" height="52" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="460" y="434" text-anchor="middle" font-family="Arial" font-size="17" fill="#0f172a">Display result</text><path d="M460 454 V484 M452 476 L460 484 L468 476" stroke="#334155" stroke-width="2" fill="none"/><rect x="170" y="488" width="580" height="52" rx="26" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="460" y="520" text-anchor