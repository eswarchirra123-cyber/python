<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="393" viewBox="0 0 1100 393"><rect width="100%" height="100%" fill="#eef2f7"/><rect x="35" y="20" width="1030" height="353" rx="16" fill="#111827"/><rect x="35" y="20" width="1030" height="48" rx="16" fill="#263244"/><circle cx="67" cy="44" r="7" fill="#f87171"/><circle cx="91" cy="44" r="7" fill="#fbbf24"/><circle cx="115" cy="44" r="7" fill="#4ade80"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="18" fill="#fff">Python Operator Explorer — illustrative preview</text><text x="70" y="105" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">a = float(input("Enter first number: "))</text><text x="70" y="134" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">b = float(input("Enter second number: "))</text><text x="70" y="163" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">print("Addition:", a + b)</text><text x="70" y="192" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">print("Subtraction:", a - b)</text><text x="70" y="221" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">print("Multiplication:", a * b)</text><text x="70" y="250" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">if b != 0:</text><text x="70" y="279" font-family="Consolas,monospace" font-size="17" fill="#d1fae5">print("Division:", a / b)</text><text x="70" y="348" font-family="Arial" font-size="14" fill="#fbbf24">Illustration only — run program.py to capture actual output for submission.</text></svg>